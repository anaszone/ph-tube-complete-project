<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <!-- DaisyUI CDN start -->
    <link
      href="https://cdn.jsdelivr.net/npm/daisyui@5"
      rel="stylesheet"
      type="text/css"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- DaisyUI CDN end -->

    <style>
      .active{
        background: red;
        color: white;
      }
    </style>
  </head>
  <body>
    <header>
      <nav
        class="w-11/12 mx-auto flex justify-between border-b-2 py-3 border-gray-400 border-opacity-20"
      >
        <div class="logo">
          <img class="w-[120px]" src="assets/Logo.png" alt="" />
        </div>
        <div class="sort">
          <button class="btn">Sort by View</button>
        </div>
        <div class="blogs">
          <button class="btn bg-red-500 text-white">Blogs</button>
        </div>
      </nav>
    </header>

    <nav id="category-container" class="flex py-5 justify-center gap-5">
      <div>
        <button onclick="loadVideos()" class="btn btn-sm bg-red-500 text-white">All</button>
      </div>
    </nav>

    <section
      id="video-container"
      class="w-11/12 mx-auto grid grid-cols-4 gap-5"
    >

    <div class="col-span-4 text-center flex flex-col justify-center items-center py-20 gap-5">
      <img class="w-[150px]" src="assets/Icon.png" alt="">
      <h2 class="text-3xl font-bold">Opss!! Sorry, there is no content here</h2>
    </div>
      
    </section>

    <script src="script/index.js"></script>
  </body>
</html>
